# ── Sunny HRM — бойовий стек: PostgreSQL + backend; HTTPS завершує зовнішній Nginx ──
# Розгортання: cp .env.example .env → заповнити → docker compose up -d --build
# Дані живуть у volume pgdata (переживають оновлення коду). Порт БД назовні НЕ
# відкриваємо. Backend доступний лише на 127.0.0.1:3000; зовнішній Nginx проксіює HTTPS.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro   # створює роль застосунку при першому старті
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 15

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV}
      APP_ENV: ${APP_ENV}
      DEMO_SEED: ${DEMO_SEED:-false}
      PORT: ${PORT}
      APP_URL: ${APP_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      # адмін-конект — лише для міграцій на старті
      ADMIN_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # робочий конект застосунку (НЕсуперюзер → діє RLS)
      DATABASE_URL: postgres://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      AI_CHAT_MAX_TOKENS: ${AI_CHAT_MAX_TOKENS:-2800}
      AI_REVIEW_MAX_TOKENS: ${AI_REVIEW_MAX_TOKENS:-3600}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SECURITY_ALERT_EMAIL: ${SECURITY_ALERT_EMAIL}
      MAIL_FROM: ${MAIL_FROM}
    volumes:
      - ./frontend:/app/frontend:ro   # віддаємо погоджений HTML (він лежить у sunny-hrm/frontend)
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:

